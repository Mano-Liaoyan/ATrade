# Alembic CLI configuration. Create a migration from backend/ with:
#   DATABASE_URL=postgresql://... uv run alembic revision -m "<capability> <change>"
# The message must start with the capability that owns the table (docs/architecture.md section 6.3).
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
