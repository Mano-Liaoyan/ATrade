# Runs the quality gate (scripts/check) on each pull request and on main.
# ibkr_paper tests do not run in CI. They need the real paper account.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ATRADE_TEST_DATABASE_URL: postgresql://atrade:atrade@127.0.0.1:5432/atrade

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: atrade
          POSTGRES_PASSWORD: atrade
          POSTGRES_DB: atrade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --username=atrade"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
      - run: |
          cd backend
          uv sync --frozen
          for i in 1 2 3; do
            echo "=== run $i"
            uv run pytest --numprocesses auto -p no:cacheprovider --durations=15 2>&1 | grep -E "^FAILED|passed|failed|isolation" || true
          done

