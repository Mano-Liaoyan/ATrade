# Runs the quality gate (scripts/check) on each pull request and on main.
# ibkr_paper tests do not run in CI. They need the real paper account.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ATRADE_TEST_DATABASE_URL: postgresql://atrade:atrade@127.0.0.1:5432/atrade

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: atrade
          POSTGRES_PASSWORD: atrade
          POSTGRES_DB: atrade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --username=atrade"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
      - run: ./scripts/check backend

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: frontend
          cache: true
      - run: ./scripts/check frontend

  assistant:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: assistant
          cache: true
      - run: ./scripts/check assistant

  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # One job for each browser and shard, so all 12 run at the same time. On 2026-10-31 one job with all 4 browsers
    # took 22 to 27 minutes, and one job for each browser took up to 8.3 minutes. Each shard has its own database and
    # server and the same 2 Playwright workers, so a test sees the same load as in one job. A hang fails the job.
    timeout-minutes: 30
    strategy:
      # A failure in one browser or shard does not cancel the others.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, msedge]
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: atrade
          POSTGRES_PASSWORD: atrade
          POSTGRES_DB: atrade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --username=atrade"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: frontend
          cache: true
      # The apt mirror of the runners can be slow: on 2026-11-05 it took more than 15 minutes for 114 MB. So the apt
      # packages and the browsers come from the cache. A mirror change is not needed then.
      - uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: |
            ~/apt-archives
            ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ matrix.browser }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: playwright-ubuntu-24.04-${{ matrix.browser }}-
      - run: |
          mkdir -p ~/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/99-ci-cache
      - run: vp exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: frontend
        # A hang stops here, not at the job timeout.
        timeout-minutes: 15
      # Before the tests, so a test failure does not lose the cache. apt writes as root.
      - run: sudo chown -R "$USER" ~/apt-archives
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v6
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/apt-archives
            ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - run: ./scripts/check e2e
        # The step stops before the job does, so the artifact step below still runs.
        timeout-minutes: 25
        env:
          ATRADE_PLAYWRIGHT_PROJECTS: ${{ matrix.browser }}
          ATRADE_PLAYWRIGHT_SHARD: ${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7
